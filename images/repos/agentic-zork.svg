<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="mva" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2fa8"/>
      <stop offset="1" stop-color="#a3237f"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a3237f"/>
    </marker>
  </defs>
  <rect width="900" height="460" fill="#ffffff"/>

  <!-- ===== Terminal running Zork ===== -->
  <g>
    <!-- monitor body -->
    <rect x="60" y="50" width="480" height="330" rx="14" fill="#d8d8d2" stroke="#9a9a92" stroke-width="2"/>
    <!-- screen -->
    <rect x="82" y="72" width="436" height="266" rx="8" fill="#0b0f0b"/>
    <!-- screen text -->
    <g font-family="Menlo, Consolas, 'Courier New', monospace" fill="#33ff66">
      <text x="104" y="108" font-size="26" font-weight="bold" fill="#ffffff">ZORK I</text>
      <text x="104" y="130" font-size="13" fill="#bbbbbb">The Great Underground Empire</text>

      <text x="104" y="166" font-size="14" font-weight="bold" fill="#ffffff">West of House</text>
      <text x="104" y="188" font-size="13">You are standing in an open field</text>
      <text x="104" y="206" font-size="13">west of a white house, with a</text>
      <text x="104" y="224" font-size="13">boarded front door.</text>
      <text x="104" y="246" font-size="13">There is a small mailbox here.</text>

      <text x="104" y="282" font-size="14" fill="#ffffff">&gt;open mailbox</text>
      <text x="104" y="304" font-size="13">Opening the mailbox reveals a</text>
      <text x="104" y="322" font-size="13">leaflet. &#9608;</text>
    </g>
    <!-- monitor stand -->
    <rect x="255" y="380" width="90" height="16" fill="#c2c2ba" stroke="#9a9a92" stroke-width="1.5"/>
    <rect x="215" y="396" width="170" height="10" rx="5" fill="#c2c2ba" stroke="#9a9a92" stroke-width="1.5"/>
  </g>

  <!-- ===== Agent robot ===== -->
  <g>
    <!-- antenna -->
    <line x1="740" y1="118" x2="740" y2="94" stroke="#555" stroke-width="3"/>
    <circle cx="740" cy="88" r="7" fill="url(#mva)"/>
    <!-- head -->
    <rect x="695" y="118" width="90" height="72" rx="16" fill="#eceef8" stroke="#2b2fa8" stroke-width="3"/>
    <!-- eyes -->
    <circle cx="723" cy="150" r="9" fill="#2b2fa8"/>
    <circle cx="757" cy="150" r="9" fill="#2b2fa8"/>
    <!-- smile -->
    <path d="M 722 170 Q 740 180 758 170" fill="none" stroke="#2b2fa8" stroke-width="3" stroke-linecap="round"/>
    <!-- body -->
    <rect x="683" y="196" width="114" height="104" rx="18" fill="#eceef8" stroke="#2b2fa8" stroke-width="3"/>
    <!-- chest label -->
    <text x="740" y="243" text-anchor="middle" font-size="15" font-weight="bold" fill="#a3237f" font-family="Menlo, Consolas, monospace">LLM</text>
    <text x="740" y="263" text-anchor="middle" font-size="11" fill="#666" font-family="Menlo, Consolas, monospace">ReAct agent</text>
    <!-- left arm typing -->
    <path d="M 683 230 C 630 240, 600 300, 575 336" fill="none" stroke="#2b2fa8" stroke-width="7" stroke-linecap="round"/>
    <!-- right arm -->
    <path d="M 797 230 C 830 250, 830 290, 812 310" fill="none" stroke="#2b2fa8" stroke-width="7" stroke-linecap="round"/>
    <!-- legs -->
    <line x1="712" y1="300" x2="712" y2="340" stroke="#2b2fa8" stroke-width="7" stroke-linecap="round"/>
    <line x1="768" y1="300" x2="768" y2="340" stroke="#2b2fa8" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="712" cy="346" rx="16" ry="7" fill="#2b2fa8"/>
    <ellipse cx="768" cy="346" rx="16" ry="7" fill="#2b2fa8"/>
  </g>

  <!-- keyboard under the robot's typing arm -->
  <g>
    <rect x="548" y="342" width="112" height="26" rx="6" fill="#d8d8d2" stroke="#9a9a92" stroke-width="2"/>
    <line x1="560" y1="350" x2="648" y2="350" stroke="#9a9a92" stroke-width="1.5"/>
    <line x1="560" y1="358" x2="648" y2="358" stroke="#9a9a92" stroke-width="1.5"/>
  </g>

  <!-- MCP tool-call arrows -->
  <g font-size="13" font-family="Menlo, Consolas, monospace">
    <path d="M 648 158 C 610 142, 585 142, 558 150" fill="none" stroke="#a3237f" stroke-width="2.5" stroke-dasharray="6 5"/>
    <polygon points="558,150 572,142 570,156" fill="#a3237f"/>
    <path d="M 552 192 C 585 202, 612 202, 642 194" fill="none" stroke="#2b2fa8" stroke-width="2.5" stroke-dasharray="6 5"/>
    <polygon points="642,194 628,188 631,202" fill="#2b2fa8"/>
    <text x="601" y="128" text-anchor="middle" fill="#a3237f">action</text>
    <text x="600" y="228" text-anchor="middle" fill="#2b2fa8">observation</text>
    <text x="600" y="246" text-anchor="middle" fill="#888" font-size="11">MCP tool calls</text>
  </g>

  <text x="450" y="440" text-anchor="middle" font-size="15" fill="#444">an LLM agent explores the Great Underground Empire, one command at a time</text>
</svg>
