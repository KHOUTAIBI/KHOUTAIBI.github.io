<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="mva" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2fa8"/>
      <stop offset="1" stop-color="#a3237f"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="900" height="460" fill="#ffffff"/>

  <!-- Left: KV cache -->
  <text x="225" y="52" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">KV cache</text>

  <!-- cached tokens -->
  <g font-size="16" text-anchor="middle">
    <rect x="60" y="90" width="70" height="54" rx="8" fill="#eceef8" stroke="#2b2fa8" stroke-width="2"/>
    <text x="95" y="122" fill="#222">The</text>
    <rect x="140" y="90" width="70" height="54" rx="8" fill="#eceef8" stroke="#2b2fa8" stroke-width="2"/>
    <text x="175" y="122" fill="#222">cat</text>
    <rect x="220" y="90" width="70" height="54" rx="8" fill="#eceef8" stroke="#2b2fa8" stroke-width="2"/>
    <text x="255" y="122" fill="#222">sat</text>
    <rect x="300" y="90" width="70" height="54" rx="8" fill="none" stroke="url(#mva)" stroke-width="3"/>
    <text x="335" y="122" fill="#a3237f" font-weight="bold">on</text>
  </g>

  <!-- cached K/V store -->
  <rect x="60" y="190" width="230" height="90" rx="10" fill="#f5f5f7" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="175" y="228" text-anchor="middle" font-size="17" fill="#333">cached K, V</text>
  <text x="175" y="254" text-anchor="middle" font-size="14" fill="#666">computed once, reused</text>

  <line x1="175" y1="150" x2="175" y2="186" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="335" y1="150" x2="335" y2="230" stroke="#a3237f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="296" y1="235" x2="335" y2="235" stroke="#a3237f" stroke-width="0"/>
  <text x="345" y="212" font-size="14" fill="#a3237f">only the new</text>
  <text x="345" y="230" font-size="14" fill="#a3237f">token attends</text>

  <text x="225" y="330" text-anchor="middle" font-size="16" fill="#333">per-step attention cost:</text>
  <text x="165" y="358" text-anchor="middle" font-size="20" fill="#222" font-family="Georgia, serif" font-style="italic">O(T&#178;)</text>
  <text x="225" y="356" text-anchor="middle" font-size="18" fill="#444">&#8594;</text>
  <text x="285" y="358" text-anchor="middle" font-size="20" fill="#2b2fa8" font-family="Georgia, serif" font-style="italic" font-weight="bold">O(T)</text>

  <!-- divider -->
  <line x1="460" y1="50" x2="460" y2="410" stroke="#ddd" stroke-width="1.5"/>

  <!-- Right: LoRA -->
  <text x="680" y="52" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">LoRA</text>

  <!-- frozen W -->
  <rect x="520" y="100" width="130" height="130" rx="10" fill="#eceef8" stroke="#555" stroke-width="2"/>
  <text x="585" y="160" text-anchor="middle" font-size="26" fill="#222" font-family="Georgia, serif" font-style="italic">W</text>
  <text x="585" y="190" text-anchor="middle" font-size="14" fill="#666">frozen</text>

  <text x="690" y="172" text-anchor="middle" font-size="26" fill="#333">+</text>

  <!-- B and A low-rank -->
  <rect x="730" y="100" width="42" height="130" rx="8" fill="none" stroke="url(#mva)" stroke-width="3"/>
  <text x="751" y="172" text-anchor="middle" font-size="22" fill="#a3237f" font-family="Georgia, serif" font-style="italic">B</text>
  <rect x="784" y="100" width="86" height="44" rx="8" fill="none" stroke="url(#mva)" stroke-width="3"/>
  <text x="827" y="129" text-anchor="middle" font-size="22" fill="#2b2fa8" font-family="Georgia, serif" font-style="italic">A</text>
  <text x="800" y="258" text-anchor="middle" font-size="14" fill="#a3237f">trainable, rank r &#8810; d</text>

  <text x="680" y="330" text-anchor="middle" font-size="16" fill="#333">fine-tune only the adapters:</text>
  <text x="680" y="358" text-anchor="middle" font-size="20" fill="#222" font-family="Georgia, serif" font-style="italic">h = Wx + BAx</text>
  <text x="680" y="390" text-anchor="middle" font-size="14" fill="#666">merge BA into W at inference, zero overhead</text>
</svg>
